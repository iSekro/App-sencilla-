<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Mis Tareas</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <input
        id="task-input"
        type="text"
        placeholder="Escribe una tarea..."
        maxlength="200"
        required
      />
      <button type="submit">Añadir</button>
    </form>

    <div class="filters" role="tablist">
      <button type="button" class="filter active" data-filter="all">Todas</button>
      <button type="button" class="filter" data-filter="active">Pendientes</button>
      <button type="button" class="filter" data-filter="done">Hechas</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <footer class="app-footer">
      <span id="counter">0 tareas pendientes</span>
      <button id="clear-done" type="button">Borrar hechas</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
