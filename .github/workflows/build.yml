name: Build Windows Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable and installer
        run: npm run build:all

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SekroDownloadManager-Portable
          path: dist/*Portable*.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SekroDownloadManager-Setup
          path: dist/*Setup*.exe
